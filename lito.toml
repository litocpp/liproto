[workspace]
name = "liproto"
members = ["runtime", "codegen", "tests"]
default-members = ["runtime", "codegen"]

[workspace.package]
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
liproto = { path = "runtime" }
liproto-codegen = { path = "codegen" }
rstd-core = "0.1.2"
rstd-alloc = "0.1.2"
rstd-parse = "0.1.2"
rstd-std = "0.1.2"
rstd-nostd = "0.1.2"
rstd-test = "0.1.2"
rstd-argparse = "0.1.2"

[profile]
exceptions = false
rtti = false
